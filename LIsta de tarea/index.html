<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO APP</title>
  <link rel="stylesheet" href="index.css" />
  
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <main id="app-container">
    <h1 class="app-title">TODO APP</h1>

    <div class="todo-card">
     
      <form id="todo-form">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Create some task..." 
            autocomplete="off"
          />
          <button type="submit" id="add-btn" aria-label="Add Task">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
        
        <p class="error-message" id="error-message">A task must be provided.</p>
      </form>

      <ul id="todo-list">
  <li class="todo-item">
    <button class="btn-action btn-delete" aria-label="Delete Task">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    
    
    <input 
      type="text" 
      class="todo-input-item" 
       
      
    />

    <button class="btn-action btn-check" aria-label="Toggle Complete">
      <ion-icon name="checkmark-outline"></ion-icon>
    </button>
  </li>
</ul>
  <ul id="todo-list">
  <li class="todo-item">
    <button class="btn-action btn-delete" aria-label="Delete Task">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    
    
    <input 
      type="text" 
      class="todo-input-item" 
     
    />

    <button class="btn-action btn-check" aria-label="Toggle Complete">
      <ion-icon name="checkmark-outline"></ion-icon>
    </button>
  </li>
</ul>
  <ul id="todo-list">
  <li class="todo-item">
    <button class="btn-action btn-delete" aria-label="Delete Task">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    
    
    <input 
      type="text" 
      class="todo-input-item" 
       
      aria-label="Task text"
    />

    <button class="btn-action btn-check" aria-label="Toggle Complete">
      <ion-icon name="checkmark-outline"></ion-icon>
    </button>
  </li>
</ul>


      
      <footer class="counters-container">
        <span class="badge badge-total">Total: <strong id="count-total"></strong></span>
        <span class="badge badge-completed">Completed: <strong id="count-completed"></strong></span>
        <span class="badge badge-incompleted">Incompleted: <strong id="count-incompleted"></strong></span>
      </footer>
    </div>
  </main>

</body>
</html>
